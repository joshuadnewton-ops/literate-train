<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marin County Lakes - Hex Map</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #mapContainer {
            background: #0f0f1e;
            border: 8px solid #4a4a6a;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(106, 176, 255, 0.3);
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            cursor: pointer;
        }

        #info {
            color: #6ab0ff;
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            line-height: 1.8;
            max-width: 800px;
        }

        #infoPanel {
            background: #2a2a4a;
            border: 4px solid #4a4a6a;
            padding: 20px;
            margin-top: 20px;
            color: #fff;
            font-size: 10px;
            line-height: 1.8;
            min-height: 150px;
            width: 800px;
            max-width: 90vw;
        }

        .lake-name {
            color: #ffd700;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .lake-detail {
            color: #6ab0ff;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="mapContainer">
        <canvas id="mapCanvas" width="800" height="600"></canvas>
    </div>
    <div id="info">
        Marin County Water District Lakes<br>
        Click on hex tiles to explore the area
    </div>
    <div id="infoPanel">
        <div class="lake-name">Click a hex tile to see information</div>
        <div class="lake-detail">Three beautiful lakes in Marin County, California</div>
    </div>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const infoPanel = document.getElementById('infoPanel');

        // 16-bit color palette
        const COLORS = {
            sky: '#87CEEB',
            water: '#1e90ff',
            deepWater: '#0066cc',
            grass: '#4a9d2f',
            darkGrass: '#2d5f1e',
            forest: '#1a4d1a',
            mountain: '#8b7355',
            trail: '#a0826d',
            sand: '#c2b280',
            highlight: '#ffd700',
            text: '#ffffff',
            shadow: 'rgba(0, 0, 0, 0.3)'
        };

        // Hex grid configuration
        const HEX_SIZE = 25;

        // Lake information
        const LAKE_INFO = {
            phoenix: {
                name: 'Phoenix Lake',
                capacity: '25 acre-feet',
                elevation: '175 feet',
                features: 'Popular 2.3-mile loop trail, great for hiking and birding',
                activities: 'Hiking, Wildlife Viewing, Photography'
            },
            lagunitas: {
                name: 'Lake Lagunitas',
                capacity: '8,180 acre-feet',
                elevation: '735 feet',
                features: 'Scenic 1.8-mile loop trail, surrounded by redwoods',
                activities: 'Hiking, Picnicking, Nature Walks'
            },
            bonTempe: {
                name: 'Lake Bon Tempe',
                capacity: '7,630 acre-feet',
                elevation: '730 feet',
                features: 'Popular for fishing, connected to Alpine Lake',
                activities: 'Fishing, Hiking, Mountain Biking'
            }
        };

        // Hex tile types
        const TILE_TYPES = {
            WATER: 'water',
            DEEP_WATER: 'deepWater',
            GRASS: 'grass',
            FOREST: 'forest',
            MOUNTAIN: 'mountain',
            TRAIL: 'trail',
            SHORE: 'shore'
        };

        // Create hex map layout - artistic representation of the three lakes
        // Layout: Bon Tempe and Lagunitas in the middle-left, Phoenix on the right
        const hexMap = [];
        let selectedHex = null;

        // Function to create hex tile
        class HexTile {
            constructor(q, r, type, lake = null) {
                this.q = q;
                this.r = r;
                this.type = type;
                this.lake = lake;
                this.hover = false;
                this.selected = false;

                // Convert axial coordinates to pixel coordinates
                this.x = HEX_SIZE * (Math.sqrt(3) * q + Math.sqrt(3)/2 * r) + 400;
                this.y = HEX_SIZE * (3/2 * r) + 300;

                // Cache forest texture positions to prevent flickering
                if (this.type === TILE_TYPES.FOREST) {
                    this.forestTexture = [];
                    for (let i = 0; i < 3; i++) {
                        this.forestTexture.push({
                            x: (Math.random() - 0.5) * HEX_SIZE * 0.6,
                            y: (Math.random() - 0.5) * HEX_SIZE * 0.6
                        });
                    }
                }

                // Cache hexagon vertices for optimized rendering
                this.vertices = [];
                for (let i = 0; i < 6; i++) {
                    const angle = (Math.PI / 3) * i;
                    this.vertices.push({
                        x: HEX_SIZE * Math.cos(angle),
                        y: HEX_SIZE * Math.sin(angle)
                    });
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Draw hexagon using cached vertices
                ctx.beginPath();
                ctx.moveTo(this.vertices[0].x, this.vertices[0].y);
                for (let i = 1; i < 6; i++) {
                    ctx.lineTo(this.vertices[i].x, this.vertices[i].y);
                }
                ctx.closePath();

                // Fill based on type
                let fillColor = COLORS.grass;
                switch(this.type) {
                    case TILE_TYPES.WATER:
                        fillColor = COLORS.water;
                        break;
                    case TILE_TYPES.DEEP_WATER:
                        fillColor = COLORS.deepWater;
                        break;
                    case TILE_TYPES.GRASS:
                        fillColor = COLORS.grass;
                        break;
                    case TILE_TYPES.FOREST:
                        fillColor = COLORS.forest;
                        break;
                    case TILE_TYPES.MOUNTAIN:
                        fillColor = COLORS.mountain;
                        break;
                    case TILE_TYPES.TRAIL:
                        fillColor = COLORS.trail;
                        break;
                    case TILE_TYPES.SHORE:
                        fillColor = COLORS.sand;
                        break;
                }

                ctx.fillStyle = fillColor;
                ctx.fill();

                // Border - show selected state (thicker blue) or hover state (gold) or default
                if (this.selected) {
                    ctx.strokeStyle = '#00bfff'; // Deep sky blue for selected
                    ctx.lineWidth = 4;
                } else if (this.hover) {
                    ctx.strokeStyle = COLORS.highlight; // Gold for hover
                    ctx.lineWidth = 3;
                } else {
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)'; // Default subtle border
                    ctx.lineWidth = 1;
                }
                ctx.stroke();

                // Add texture for water tiles
                if (this.type === TILE_TYPES.WATER || this.type === TILE_TYPES.DEEP_WATER) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.fillRect(-HEX_SIZE/3, -2, HEX_SIZE/2, 2);
                }

                // Add texture for forest using cached positions
                if (this.type === TILE_TYPES.FOREST && this.forestTexture) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                    for (const pos of this.forestTexture) {
                        ctx.fillRect(pos.x, pos.y, 3, 3);
                    }
                }

                ctx.restore();
            }

            containsPoint(x, y) {
                // Proper point-in-hexagon detection for pointy-top hexagons
                const dx = x - this.x;
                const dy = y - this.y;

                // Convert to axial coordinates
                const q = (Math.sqrt(3)/3 * dx - 1/3 * dy) / HEX_SIZE;
                const r = (2/3 * dy) / HEX_SIZE;

                // Convert to cube coordinates
                const s = -q - r;

                // Round to nearest hex
                let rq = Math.round(q);
                let rr = Math.round(r);
                let rs = Math.round(s);

                const q_diff = Math.abs(rq - q);
                const r_diff = Math.abs(rr - r);
                const s_diff = Math.abs(rs - s);

                if (q_diff > r_diff && q_diff > s_diff) {
                    rq = -rr - rs;
                } else if (r_diff > s_diff) {
                    rr = -rq - rs;
                }

                // Check if the rounded coordinates match this hex's coordinates
                return rq === this.q && rr === this.r;
            }

            getInfo() {
                if (this.lake) {
                    return LAKE_INFO[this.lake];
                }

                switch(this.type) {
                    case TILE_TYPES.WATER:
                    case TILE_TYPES.DEEP_WATER:
                        return {
                            name: 'Water',
                            features: 'Fresh water reservoir for Marin County',
                            activities: 'No swimming allowed - protected watershed'
                        };
                    case TILE_TYPES.FOREST:
                        return {
                            name: 'Forest',
                            features: 'Mixed conifer and hardwood forest',
                            activities: 'Hiking trails, wildlife habitat'
                        };
                    case TILE_TYPES.TRAIL:
                        return {
                            name: 'Trail',
                            features: 'Hiking and biking trails',
                            activities: 'Hiking, Mountain Biking, Trail Running'
                        };
                    case TILE_TYPES.MOUNTAIN:
                        return {
                            name: 'Hills',
                            features: 'Marin Hills terrain',
                            activities: 'Scenic viewpoints'
                        };
                    default:
                        return {
                            name: 'Watershed Land',
                            features: 'Protected watershed area',
                            activities: 'Part of the Marin Municipal Water District'
                        };
                }
            }
        }

        // Generate the map with three distinct lake areas
        function generateMap() {
            // Lake Bon Tempe (left-center, larger)
            const bonTempeCenter = {q: -4, r: -2};
            for (let q = -6; q <= -2; q++) {
                for (let r = -4; r <= 0; r++) {
                    const dist = Math.sqrt(Math.pow(q - bonTempeCenter.q, 2) + Math.pow(r - bonTempeCenter.r, 2));
                    if (dist < 2.5) {
                        hexMap.push(new HexTile(q, r, dist < 1.5 ? TILE_TYPES.DEEP_WATER : TILE_TYPES.WATER, 'bonTempe'));
                    } else if (dist < 3.2) {
                        hexMap.push(new HexTile(q, r, TILE_TYPES.SHORE, 'bonTempe'));
                    }
                }
            }

            // Lake Lagunitas (left-center, slightly above Bon Tempe)
            const lagunitasCenter = {q: -4, r: -6};
            for (let q = -6; q <= -2; q++) {
                for (let r = -8; r <= -4; r++) {
                    const dist = Math.sqrt(Math.pow(q - lagunitasCenter.q, 2) + Math.pow(r - lagunitasCenter.r, 2));
                    if (dist < 2.2) {
                        hexMap.push(new HexTile(q, r, dist < 1.3 ? TILE_TYPES.DEEP_WATER : TILE_TYPES.WATER, 'lagunitas'));
                    } else if (dist < 3.0) {
                        hexMap.push(new HexTile(q, r, TILE_TYPES.SHORE, 'lagunitas'));
                    }
                }
            }

            // Phoenix Lake (right side, smaller)
            const phoenixCenter = {q: 3, r: -3};
            for (let q = 1; q <= 5; q++) {
                for (let r = -5; r <= -1; r++) {
                    const dist = Math.sqrt(Math.pow(q - phoenixCenter.q, 2) + Math.pow(r - phoenixCenter.r, 2));
                    if (dist < 1.8) {
                        hexMap.push(new HexTile(q, r, dist < 1.0 ? TILE_TYPES.DEEP_WATER : TILE_TYPES.WATER, 'phoenix'));
                    } else if (dist < 2.5) {
                        hexMap.push(new HexTile(q, r, TILE_TYPES.SHORE, 'phoenix'));
                    }
                }
            }

            // Fill in surrounding terrain
            for (let q = -8; q <= 7; q++) {
                for (let r = -9; r <= 2; r++) {
                    // Check if this position already has a tile
                    const exists = hexMap.some(tile => tile.q === q && tile.r === r);
                    if (!exists) {
                        // Add forest, grass, mountains, and trails
                        const random = Math.random();
                        let type = TILE_TYPES.GRASS;

                        // Create forest around lakes
                        if (random < 0.4) {
                            type = TILE_TYPES.FOREST;
                        } else if (random < 0.6) {
                            type = TILE_TYPES.GRASS;
                        } else if (random < 0.7) {
                            type = TILE_TYPES.MOUNTAIN;
                        } else if (random < 0.75) {
                            type = TILE_TYPES.TRAIL;
                        } else {
                            type = TILE_TYPES.GRASS;
                        }

                        hexMap.push(new HexTile(q, r, type));
                    }
                }
            }
        }

        // Update info panel
        function updateInfoPanel(hexTile) {
            const info = hexTile.getInfo();
            let html = `<div class="lake-name">${info.name}</div>`;

            if (info.capacity) {
                html += `<div class="lake-detail">Capacity: ${info.capacity}</div>`;
            }
            if (info.elevation) {
                html += `<div class="lake-detail">Elevation: ${info.elevation}</div>`;
            }
            if (info.features) {
                html += `<div class="lake-detail">Features: ${info.features}</div>`;
            }
            if (info.activities) {
                html += `<div class="lake-detail">Activities: ${info.activities}</div>`;
            }

            infoPanel.innerHTML = html;
        }

        // Draw the map
        function draw() {
            // Clear canvas
            ctx.fillStyle = COLORS.sky;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw title
            ctx.fillStyle = COLORS.text;
            ctx.font = '16px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.shadowColor = COLORS.shadow;
            ctx.shadowBlur = 4;
            ctx.fillText('MARIN COUNTY LAKES', 400, 40);
            ctx.shadowBlur = 0;

            ctx.font = '10px "Press Start 2P"';
            ctx.fillText('16-Bit Hex Map Edition', 400, 65);

            // Draw all hex tiles
            hexMap.forEach(tile => tile.draw());

            // Draw legend
            const legendX = 50;
            const legendY = 100;
            ctx.font = '8px "Press Start 2P"';
            ctx.textAlign = 'left';

            const legendItems = [
                {color: COLORS.deepWater, label: 'Deep Water'},
                {color: COLORS.water, label: 'Lake Water'},
                {color: COLORS.sand, label: 'Shore'},
                {color: COLORS.forest, label: 'Forest'},
                {color: COLORS.grass, label: 'Grass'},
                {color: COLORS.trail, label: 'Trail'},
                {color: COLORS.mountain, label: 'Hills'}
            ];

            legendItems.forEach((item, i) => {
                ctx.fillStyle = item.color;
                ctx.fillRect(legendX, legendY + i * 20, 15, 15);
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.strokeRect(legendX, legendY + i * 20, 15, 15);
                ctx.fillStyle = COLORS.text;
                ctx.fillText(item.label, legendX + 20, legendY + i * 20 + 11);
            });

            // Draw lake labels
            ctx.font = '10px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.fillStyle = COLORS.highlight;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.lineWidth = 3;

            // Bon Tempe label
            ctx.strokeText('BON TEMPE', 250, 320);
            ctx.fillText('BON TEMPE', 250, 320);

            // Lagunitas label
            ctx.strokeText('LAGUNITAS', 250, 220);
            ctx.fillText('LAGUNITAS', 250, 220);

            // Phoenix label
            ctx.strokeText('PHOENIX', 550, 280);
            ctx.fillText('PHOENIX', 550, 280);
        }

        // Mouse move handler
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            let hovering = false;
            hexMap.forEach(tile => {
                const wasHover = tile.hover;
                tile.hover = tile.containsPoint(x, y);
                if (tile.hover) {
                    hovering = true;
                }
            });

            canvas.style.cursor = hovering ? 'pointer' : 'default';
            draw();
        });

        // Click handler
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Clear previous selection
            hexMap.forEach(tile => {
                tile.selected = false;
            });

            // Set new selection
            hexMap.forEach(tile => {
                if (tile.containsPoint(x, y)) {
                    selectedHex = tile;
                    tile.selected = true;
                    updateInfoPanel(tile);
                }
            });

            draw();
        });

        // Initialize
        generateMap();
        draw();
    </script>
</body>
</html>
